[package]
name = "pons-radar"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
csv = "1.3"
config = { version = "0.15", default-features = false, features = ["toml"] }
mime_guess = "2.0"
pons-chain = { path = "../chain" }
pons-domain = { path = "../domain" }
pons-v2 = { path = "../pons_v2" }
pons-storage = { path = "../storage" }
pons-updater = { path = "../updater" }
rust-embed = "8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
rust_decimal = "1.38"
subtle = "2.6"
thiserror = "2.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
url = "2.5"

[dev-dependencies]
async-trait = "0.1"
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.28"

[lints]
workspace = true
