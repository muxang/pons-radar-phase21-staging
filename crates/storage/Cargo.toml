[package]
name = "pons-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
alloy-primitives = { version = "1.7", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
pons-domain = { path = "../domain" }
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
rust_decimal = { version = "1.37", default-features = false, features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono", "uuid", "json", "rust_decimal"] }
thiserror = "2.0"
sha2 = "0.10"
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
alloy-primitives = { version = "1.3", default-features = false }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
