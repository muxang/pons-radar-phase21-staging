[package]
name = "pons-v2"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
alloy-primitives = { version = "1.7", default-features = false }
alloy-sol-types = { version = "1.7", default-features = false }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
num-bigint = "0.4"
rust_decimal = { version = "1.37", default-features = false, features = ["serde-with-str"] }
pons-chain = { path = "../chain" }
pons-domain = { path = "../domain" }
pons-storage = { path = "../storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false }
thiserror = "2"
uuid = { version = "1.18", features = ["serde"] }
tokio = { version = "1.47", features = ["sync", "time", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2.5"

[dev-dependencies]
async-trait = "0.1"
chrono = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[lints]
workspace = true
